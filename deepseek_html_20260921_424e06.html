<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сканер тестов 2ГИС — правильные ответы по скрину</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg1:#667eea; --bg2:#764ba2; --card:#fff; --text:#333;
    --muted:#888; --line:#e0e0e0; --ok:#4caf50; --okbg:#e8f5e9;
    --no:#f44336; --nobg:#ffebee; --soft:#f5f7ff;
    --warn:#f59e0b; --warnbg:#fff7e6;
  }
  body.dark{
    --bg1:#1a1a2e; --bg2:#16213e; --card:#22223a; --text:#eee;
    --muted:#999; --line:#3a3a55; --soft:#2a2a45;
    --okbg:#1e3a24; --nobg:#3a1e22; --warnbg:#3a2e10;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:20px;color:var(--text);transition:background .3s;
  }
  .container{
    background:var(--card);border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    max-width:800px;width:100%;padding:35px;margin:auto;
  }
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}
  h1{color:#667eea;font-size:24px;line-height:1.3}
  body.dark h1{color:#8b9dff}
  .subtitle{color:var(--muted);margin:10px 0 25px;font-size:14px;line-height:1.55}
  .theme-btn{
    background:var(--soft);border:none;font-size:20px;cursor:pointer;
    border-radius:10px;padding:8px 12px;transition:.2s;color:var(--text);
  }
  .theme-btn:hover{transform:scale(1.1)}
  .paste-zone{
    border:3px dashed var(--line);border-radius:18px;
    padding:60px 20px;text-align:center;
    background:var(--soft);margin-bottom:20px;transition:.2s;
  }
  .paste-zone.active{border-color:#667eea;background:#eef1ff}
  body.dark .paste-zone.active{background:#2f2f50}
  .paste-zone .icon{font-size:64px;margin-bottom:12px}
  .paste-zone .title{font-size:20px;font-weight:700;margin-bottom:10px;color:#667eea}
  body.dark .paste-zone .title{color:#8b9dff}
  .paste-zone .hint{font-size:14px;color:var(--muted);line-height:1.6}
  .paste-zone kbd{
    background:var(--card);border:1px solid var(--line);
    border-radius:6px;padding:2px 8px;font-family:monospace;font-size:13px;
  }
  .preview{margin-bottom:20px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
  .preview img{display:block;width:100%;max-height:400px;object-fit:contain}
  .progress-box{background:var(--soft);border-radius:12px;padding:16px;margin-bottom:20px}
  .progress-box .line{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 8px}
  .progress-box .fill{height:100%;width:0;background:linear-gradient(90deg,#667eea,#764ba2);transition:.3s}
  .progress-box .status{font-size:14px;color:var(--muted);text-align:center}
  .answer-hero{
    background:linear-gradient(135deg,#4caf50,#2e7d32);
    color:#fff;border-radius:16px;padding:26px;margin-bottom:18px;
    box-shadow:0 10px 30px rgba(76,175,80,.35);
  }
  .answer-hero.multi{
    background:linear-gradient(135deg,#7c3aed,#5b21b6);
    box-shadow:0 10px 30px rgba(124,58,237,.35);
  }
  .answer-hero.warn{
    background:linear-gradient(135deg,#f59e0b,#d97706);
    box-shadow:0 10px 30px rgba(245,158,11,.35);
  }
  .answer-hero.no{
    background:linear-gradient(135deg,#f44336,#c62828);
    box-shadow:0 10px 30px rgba(244,67,54,.35);
  }
  .answer-hero .tag{
    display:inline-block;background:rgba(255,255,255,.22);
    padding:4px 14px;border-radius:20px;font-size:12px;
    font-weight:700;margin-bottom:14px;letter-spacing:.5px;
  }
  .answer-hero .hero-label{font-size:14px;opacity:.95;margin-bottom:12px}
  .answer-hero .answers-list{display:flex;flex-direction:column;gap:10px}
  .answer-hero .ans-item{
    background:rgba(255,255,255,.18);
    padding:14px 18px;border-radius:10px;
    font-size:16px;font-weight:600;line-height:1.45;
    text-align:left;display:flex;gap:10px;align-items:flex-start;
  }
  .answer-hero .ans-item .check{flex-shrink:0;font-size:18px;line-height:1.2}
  .answer-hero .meta{font-size:12px;opacity:.85;margin-top:14px;line-height:1.5}
  .answer-hero .hint-below{
    font-size:13px;opacity:.95;margin-top:16px;padding:10px 14px;
    background:rgba(0,0,0,.15);border-radius:8px;line-height:1.5;
  }
  .info-card{background:var(--soft);border-radius:12px;padding:18px;margin-bottom:16px}
  .info-card h3{font-size:13px;color:#667eea;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
  body.dark .info-card h3{color:#8b9dff}
  .info-card .note{
    font-size:14px;color:var(--text);line-height:1.6;
    padding:12px;background:var(--card);border-radius:8px;
    border-left:3px solid #667eea;
  }
  .info-card .warn-note{
    font-size:13px;color:var(--warn);line-height:1.55;margin-top:12px;
    padding:10px;background:var(--warnbg);border-radius:8px;
  }
  .diag{
    font-size:12px;color:var(--muted);line-height:1.6;
    padding:10px;background:var(--card);border-radius:8px;
    margin-top:10px;font-family:monospace;
  }
  .diag b{color:#667eea}
  .diag .ok{color:var(--ok);font-weight:700}
  .diag .no{color:var(--no);font-weight:700}
  .btn{
    background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;
    padding:14px 30px;border-radius:12px;font-size:16px;font-weight:600;
    cursor:pointer;width:100%;transition:.2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(102,126,234,.4)}
  .btn.secondary{background:var(--soft);color:#667eea;margin-top:12px}
  body.dark .btn.secondary{color:#8b9dff}
  .hidden{display:none}
  @media(max-width:560px){
    .container{padding:20px;border-radius:16px}
    h1{font-size:19px}
    .paste-zone{padding:40px 15px}
    .paste-zone .icon{font-size:48px}
    .answer-hero{padding:20px}
    .answer-hero .ans-item{font-size:15px;padding:12px 14px}
  }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>🔍 Сканер тестов 2ГИС</h1>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
  <p class="subtitle">
    Сделай скриншот вопроса и нажми <kbd>Ctrl</kbd>+<kbd>V</kbd> — сервис определит <b>тип вопроса</b> и покажет <b>правильные ответы текстом</b>.
  </p>

  <div id="paste-zone" class="paste-zone">
    <div class="icon">📸</div>
    <div class="title">Нажми Ctrl + V, чтобы вставить скриншот</div>
    <div class="hint">Скопируй картинку из буфера — распознавание запустится автоматически</div>
  </div>

  <div id="preview-box" class="preview hidden"><img id="preview-img" alt=""></div>

  <div id="progress-area" class="hidden">
    <div class="progress-box">
      <div class="status" id="progress-status">Готовим распознавание…</div>
      <div class="line"><div class="fill" id="progress-fill"></div></div>
      <div class="status" id="progress-percent">0%</div>
    </div>
  </div>

  <div id="result-area" class="hidden">
    <div id="answer-hero"></div>
    <div id="found-question"></div>
    <button class="btn secondary" onclick="clearAll()">← Вставить другой скриншот</button>
  </div>
</div>

   УТИЛИТЫ
   ============================================================ */
const $ = id => document.getElementById(id);

function norm(s){
  return (s||'').toLowerCase()
    .replace(/ё/g,'е')
    .replace(/[^\wа-я0-9%\s+]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function containsWord(haystackNorm, wordNorm){
  if(!wordNorm) return false;
  const escaped = wordNorm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const reWhole = new RegExp('(^|\\s)' + escaped + '(\\s|$)');
  if(reWhole.test(haystackNorm)) return true;
  if(wordNorm.length >= 5){
    const reStart = new RegExp('(^|\\s)' + escaped);
    if(reStart.test(haystackNorm)) return true;
  }
  return false;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function detectTypeFromText(ocrText){
  const n = norm(ocrText);

  const multiPhrases = [
    'выберите все верные','выберите все правильные',
    'выберите несколько','несколько вариантов',
    'все верные варианты','все правильные варианты','все подходящие'
  ];
  const singlePhrases = ['выберите один','один вариант','выберите вариант'];
  const tfPhrases = ['верно ли','правда ли','верно что','верно ли утверждение'];

  if(multiPhrases.some(p => n.includes(p))) return 'multi';
  if(tfPhrases.some(p => n.includes(p))) return 'truefalse';
  if(singlePhrases.some(p => n.includes(p))) return 'single';

  const squareMarks = (ocrText.match(/[\[\]□☐■❑▢]/g) || []).length;
  const checkMarks = (ocrText.match(/[☑✓✔]/g) || []).length;
  const circleMarks = (ocrText.match(/[○◦◯]/g) || []).length;

  if(squareMarks >= 2 || checkMarks >= 2) return 'multi';
  if(circleMarks >= 2) return 'single';

  return 'unknown';
}

/* ============================================================
   ПОИСК ПРАВИЛА (ЖЁСТКИЙ ФИЛЬТР)
   Правило проходит, только если ВСЕ questionKeys найдены.
   Если ни одно правило не проходит — берём лучший «мягкий» вариант.
   ============================================================ */
function findRule(ocrNorm, detectedType){
  const all = RULES.map(r => {
    const topicHits = r.topic.filter(t => containsWord(ocrNorm, norm(t))).length;
    const strongHit = r.topicStrong.some(t => containsWord(ocrNorm, norm(t)));

    const qKeys = r.questionKeys || [];
    const qKeyHits = qKeys.filter(k => containsWord(ocrNorm, norm(k))).length;
    const qKeyAll = qKeys.length === 0 ? true : qKeyHits === qKeys.length;
    const qKeyHalf = qKeys.length === 0 ? true : qKeyHits >= Math.ceil(qKeys.length / 2);

    let score = topicHits * 2 + (strongHit ? 3 : 0);

    if(qKeys.length > 0){
      if(qKeyAll) score += qKeyHits * 6;
      else if(qKeyHalf) score += qKeyHits * 2;
      else score -= 15; // почти всегда отбрасывается
    }

    // Тип вопроса
    if(detectedType && detectedType !== 'unknown' && r.type){
      if(r.type === detectedType) score += 5;
      else score -= 8;
    }

    return {...r, topicHits, strongHit, qKeyHits, qKeyAll, qKeyHalf, score};
  });

  // 1) Строгий фильтр — все questionKeys найдены + тема совпала
  const strict = all
    .filter(r => r.qKeyAll && ((r.topicHits >= 1) || r.strongHit))
    .sort((a,b) => b.score - a.score);

  if(strict.length > 0){
    return {...strict[0], matchType: 'strict'};
  }

  // 2) Мягкий фильтр — половина questionKeys найдена
  const soft = all
    .filter(r => r.qKeyHalf && ((r.topicHits >= 1) || r.strongHit))
    .sort((a,b) => b.score - a.score);

  if(soft.length > 0){
    return {...soft[0], matchType: 'soft'};
  }

  return null;
}

   ============================================================ */
let busy = false;

document.addEventListener('paste', e => {
  if(busy) return;
  const items = e.clipboardData?.items;
  if(!items) return;
  for(const it of items){
    if(it.type?.startsWith('image/')){
      e.preventDefault();
      handleImage(it.getAsFile());
      return;
    }
  }
});

const pz = $('paste-zone');
['dragenter','dragover'].forEach(ev => pz.addEventListener(ev, e => {
  e.preventDefault(); pz.classList.add('active');
}));
['dragleave','drop'].forEach(ev => pz.addEventListener(ev, e => {
  e.preventDefault(); pz.classList.remove('active');
}));
pz.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if(f && f.type.startsWith('image/')) handleImage(f);
});

async function handleImage(file){
  if(busy) return;
  busy = true;
  const url = URL.createObjectURL(file);
  $('preview-img').src = url;
  $('preview-box').classList.remove('hidden');
  $('result-area').classList.add('hidden');
  $('progress-area').classList.remove('hidden');
  setProgress(0, 'Инициализируем…');
  window.scrollTo({top: 200, behavior: 'smooth'});

  try{
    const result = await Tesseract.recognize(file, 'rus+eng', {
      logger: m => {
        if(m.status === 'recognizing text') setProgress(Math.round(m.progress * 100), 'Распознаём текст…');
        else if(m.status === 'loading language traineddata') setProgress(5, 'Загружаем языковые данные…');
        else setProgress(2, 'Подготовка…');
      }
    });
    setProgress(100, 'Готово!');
    setTimeout(() => { renderResult(result.data.text || ''); busy = false; }, 200);
  } catch(err){
    $('progress-area').classList.add('hidden');
    busy = false;
    alert('Ошибка распознавания: ' + err.message);
  }
}

function setProgress(p, status){
  $('progress-fill').style.width = p + '%';
  $('progress-percent').textContent = p + '%';
  $('progress-status').textContent = status;
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function renderResult(ocrText){
  $('progress-area').classList.add('hidden');
  $('result-area').classList.remove('hidden');

  const ocrNorm = norm(ocrText);
  const heroBox = $('answer-hero');
  const foundBox = $('found-question');

  const detectedType = detectTypeFromText(ocrText);
  const rule = findRule(ocrNorm, detectedType);

  if(!rule){
    heroBox.innerHTML = `
      <div class="answer-hero no">
        <div class="tag">НЕ НАЙДЕНО</div>
        <div class="hero-label">Вопрос не удалось сопоставить с базой знаний</div>
        <div class="meta">Попробуй сделать скриншот чётче или пришли текст вопроса — я добавлю правило.</div>
      </div>`;
    foundBox.innerHTML = '';
    return;
  }

  let finalType = rule.type;
  if(detectedType && detectedType !== 'unknown'){
    finalType = detectedType;
  }

  const isMulti = finalType === 'multi';
  const typeTag = isMulti ? 'НЕСКОЛЬКО ОТВЕТОВ' : (finalType === 'truefalse' ? 'ВЕРНО / НЕВЕРНО' : 'ОДИН ОТВЕТ');
  const heroCls = isMulti ? 'answer-hero multi' : (rule.matchType === 'soft' ? 'answer-hero warn' : 'answer-hero');
  const labelText = isMulti ? 'Правильные ответы:' : 'Правильный ответ:';

  const answersHtml = rule.correctTexts.map(t =>
    `<div class="ans-item"><span class="check">✅</span><span>${escapeHtml(t)}</span></div>`
  ).join('');

  heroBox.innerHTML = `
    <div class="${heroCls}">
      <div class="tag">${typeTag}</div>
      <div class="hero-label">${labelText}</div>
      <div class="answers-list">${answersHtml}</div>
      <div class="hint-below">💡 Найди эти ответы на скрине <b>по тексту</b>. Номера не показываются, чтобы не путать.</div>
      <div class="meta">
        ${rule.matchType === 'strict' ? '✅ Точное совпадение' : '⚠️ Приблизительное совпадение'} · тема ${rule.topicHits}/${rule.topic.length} · ключи вопроса ${rule.qKeyHits}/${rule.questionKeys.length}
      </div>
    </div>
  `;

  let qHtml = `<div class="info-card">
    <h3>📘 Из материалов</h3>
    <div class="note">${escapeHtml(rule.note)}</div>`;

  // Диагностика — что сработало
  const qKeysList = rule.questionKeys.map(k => {
    const found = containsWord(ocrNorm, norm(k));
    return `<span class="${found ? 'ok' : 'no'}">${found ? '✓' : '✗'} ${k}</span>`;
  }).join(' · ');

  qHtml += `<div class="diag">
    <b>Сработавшее правило (${rule.matchType === 'strict' ? 'строгое' : 'мягкое'}):</b><br>
    Тема: ${rule.topic.map(t => containsWord(ocrNorm, norm(t)) ? '<span class="ok">✓</span> ' + t : '<span class="no">✗</span> ' + t).join(', ')}<br>
    Ключи вопроса: ${qKeysList}
  </div>`;

  if(detectedType !== 'unknown' && rule.type && detectedType !== rule.type){
    qHtml += `<div class="warn-note">
      ⚠️ На скрине маркеры указывают на тип «${detectedType === 'multi' ? 'несколько ответов' : detectedType === 'truefalse' ? 'верно/неверно' : 'один ответ'}»,
      а в базе правило — «${rule.type === 'multi' ? 'несколько ответов' : rule.type === 'truefalse' ? 'верно/неверно' : 'один ответ'}».
    </div>`;
  }

  qHtml += `</div>`;
  foundBox.innerHTML = qHtml;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function clearAll(){
  busy = false;
  $('preview-box').classList.add('hidden');
  $('preview-img').src = '';
  $('result-area').classList.add('hidden');
  $('progress-area').classList.add('hidden');
  $('paste-zone').classList.remove('hidden');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function toggleTheme(){
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.querySelectorAll('.theme-btn').forEach(b => b.textContent = isDark ? '☀️' : '🌙');
  try{ localStorage.setItem('theme', isDark ? 'dark' : 'light'); }catch(e){}
}

document.addEventListener('DOMContentLoaded', () => {
  try{
    if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
  }catch(e){}
  const isDark = document.body.classList.contains('dark');
  document.querySelectorAll('.theme-btn').forEach(b => b.textContent = isDark ? '☀️' : '🌙');
});
</script>
